<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz Hediye Kutusu Oyunu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #1b1e2e 0%, #0a0c16 100%);
            color: #fff;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Responsive Viewport Simulator Styles */
        .viewport-pc {
            width: 100%;
            max-width: 100%;
            height: 100vh;
            border-radius: 0px;
        }

        .viewport-tablet {
            width: 768px;
            max-width: 95vw;
            height: 85vh;
            border: 12px solid #2d3748;
            border-radius: 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .viewport-phone {
            width: 390px;
            max-width: 92vw;
            height: 80vh;
            border: 10px solid #2d3748;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        /* 3D Box Animations */
        .box-container {
            perspective: 1000px;
        }

        .gift-box {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .gift-box:hover {
            transform: scale(1.05) rotateY(5deg);
        }

        .gift-box.opening {
            animation: shake 0.6s ease-in-out infinite alternate;
        }

        @keyframes shake {
            0% { transform: rotate(-3deg) scale(1.05); }
            100% { transform: rotate(3deg) scale(1.05); }
        }

        /* Lid opening animation */
        .gift-lid {
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.5s ease;
            transform-origin: top center;
        }

        .opened .gift-lid {
            transform: translateY(-120px) rotate(-15deg) scale(0.9);
            opacity: 0.2;
        }

        /* Glow effects */
        .glow-red {
            filter: drop-shadow(0 0 35px rgba(239, 68, 68, 0.8));
        }

        .glow-green {
            filter: drop-shadow(0 0 35px rgba(34, 197, 94, 0.8));
        }

        .glow-blue {
            filter: drop-shadow(0 0 35px rgba(59, 130, 246, 0.8));
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2 sm:p-4">

    <!-- MAIN SIMULATOR CONTAINER -->
    <div id="appContainer" class="viewport-pc transition-all duration-500 ease-in-out bg-slate-900/90 backdrop-blur-md relative flex flex-col justify-between overflow-hidden border-slate-800">
        
        <!-- TOP HEADER BAR -->
        <header class="p-4 flex justify-between items-center bg-slate-950/60 border-b border-slate-800/80 z-20">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-gift text-amber-400 text-2xl animate-bounce"></i>
                <h1 class="text-xl sm:text-2xl font-black bg-gradient-to-r from-amber-400 via-rose-500 to-purple-500 bg-clip-text text-transparent">
                    MYSTERY BOX
                </h1>
            </div>
            
            <!-- Quick Navigation / Reset button when inside game stage -->
            <button id="resetStageBtn" onclick="showSettingsScreen()" class="hidden px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs sm:text-sm font-semibold transition border border-slate-700 flex items-center gap-2">
                <i class="fa-solid fa-gear text-slate-400"></i>
                <span data-i18n="settingsBtn">Ayarlar</span>
            </button>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 flex items-center justify-center p-4 relative overflow-y-auto z-10">
            
            <!-- STAGE 1: SETTINGS / PRE-GAME SCREEN -->
            <div id="settingsStage" class="w-full max-w-md bg-slate-950/80 border border-slate-800 p-6 rounded-2xl shadow-2xl backdrop-blur-xl flex flex-col gap-6">
                
                <div class="text-center">
                    <h2 data-i18n="configTitle" class="text-2xl font-bold text-slate-100 mb-1">Oyun Ayarları</h2>
                    <p data-i18n="configSubtitle" class="text-xs text-slate-400">Devam etmeden önce dil ve ekran tercihinizi yapın</p>
                </div>

                <!-- Language Selection -->
                <div class="space-y-2">
                    <label data-i18n="selectLanguage" class="block text-xs font-bold uppercase tracking-wider text-slate-400">
                        <i class="fa-solid fa-language mr-1"></i> Dil Seçimi
                    </label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="changeLanguage('tr')" id="lang-tr" class="lang-btn p-3 rounded-xl border border-slate-700 bg-slate-900 hover:bg-slate-800 transition flex items-center gap-3">
                            <span class="text-xl">🇹🇷</span>
                            <span class="font-medium text-sm">Türkçe</span>
                        </button>
                        <button onclick="changeLanguage('en')" id="lang-en" class="lang-btn p-3 rounded-xl border border-slate-700 bg-slate-900 hover:bg-slate-800 transition flex items-center gap-3">
                            <span class="text-xl">🇬🇧</span>
                            <span class="font-medium text-sm">English</span>
                        </button>
                        <button onclick="changeLanguage('es')" id="lang-es" class="lang-btn p-3 rounded-xl border border-slate-700 bg-slate-900 hover:bg-slate-800 transition flex items-center gap-3">
                            <span class="text-xl">🇪🇸</span>
                            <span class="font-medium text-sm">Español</span>
                        </button>
                        <button onclick="changeLanguage('fr')" id="lang-fr" class="lang-btn p-3 rounded-xl border border-slate-700 bg-slate-900 hover:bg-slate-800 transition flex items-center gap-3">
                            <span class="text-xl">🇫🇷</span>
                            <span class="font-medium text-sm">Français</span>
                        </button>
                    </div>
                </div>

                <!-- Device Viewport Selection -->
                <div class="space-y-2">
                    <label data-i18n="selectDevice" class="block text-xs font-bold uppercase tracking-wider text-slate-400">
                        <i class="fa-solid fa-mobile-screen mr-1"></i> Cihaz Ekran Görünümü
                    </label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="changeDevice('pc')" id="device-pc" class="device-btn p-3 rounded-xl border border-slate-700 bg-slate-900 hover:bg-slate-800 transition flex flex-col items-center gap-1">
                            <i class="fa-solid fa-desktop text-lg text-slate-300"></i>
                            <span data-i18n="devicePc" class="text-xs font-semibold">PC</span>
                        </button>
                        <button onclick="changeDevice('tablet')" id="device-tablet" class="device-btn p-3 rounded-xl border border-slate-700 bg-slate-900 hover:bg-slate-800 transition flex flex-col items-center gap-1">
                            <i class="fa-solid fa-tablet-screen-button text-lg text-slate-300"></i>
                            <span data-i18n="deviceTablet" class="text-xs font-semibold">Tablet</span>
                        </button>
                        <button onclick="changeDevice('phone')" id="device-phone" class="device-btn p-3 rounded-xl border border-slate-700 bg-slate-900 hover:bg-slate-800 transition flex flex-col items-center gap-1">
                            <i class="fa-solid fa-mobile-retro text-lg text-slate-300"></i>
                            <span data-i18n="devicePhone" class="text-xs font-semibold">Telefon</span>
                        </button>
                    </div>
                </div>

                <!-- Continue Button -->
                <button onclick="startGameStage()" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-amber-500 to-rose-500 hover:from-amber-600 hover:to-rose-600 font-bold text-white shadow-lg shadow-rose-500/30 transform active:scale-95 transition flex items-center justify-center gap-2">
                    <span data-i18n="continueBtn">Devam Et</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <!-- STAGE 2: MYSTERY GIFT BOX GAME STAGE -->
            <div id="gameStage" class="hidden w-full max-w-lg flex flex-col items-center justify-center gap-6 py-4">
                
                <!-- Probability Legend -->
                <div class="flex gap-2 sm:gap-4 bg-slate-950/70 p-3 rounded-2xl border border-slate-800 text-xs shadow-inner">
                    <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-blue-500/10 border border-blue-500/30">
                        <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
                        <span class="text-slate-300 font-medium"><span data-i18n="blue">Mavi</span>: 65%</span>
                    </div>
                    <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-emerald-500/10 border border-emerald-500/30">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        <span class="text-slate-300 font-medium"><span data-i18n="green">Yeşil</span>: 28%</span>
                    </div>
                    <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-rose-500/10 border border-rose-500/30">
                        <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                        <span class="text-slate-300 font-medium"><span data-i18n="red">Kırmızı</span>: 7%</span>
                    </div>
                </div>

                <!-- Interactive SVG Gift Box (Styled like the reference image) -->
                <div class="box-container my-4" onclick="openBox()">
                    <div id="giftBox" class="gift-box w-64 h-64 sm:w-72 sm:h-72 relative flex items-center justify-center">
                        
                        <!-- SVG Rendering of Red Box with Golden Ribbon -->
                        <svg class="w-full h-full drop-shadow-2xl" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Box Body (Red) -->
                            <g id="boxBody">
                                <!-- Left Darker Red Side -->
                                <path d="M40 130 L150 175 L150 270 L40 220 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="3"/>
                                <!-- Right Red Side -->
                                <path d="M150 175 L260 130 L260 220 L150 270 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
                                <!-- Vertical Yellow Ribbons on Body -->
                                <path d="M85 148 L105 156 L105 246 L85 238 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
                                <path d="M195 156 L215 148 L215 238 L195 246 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
                            </g>

                            <!-- Box Lid & Bow (Separate group for lift animation) -->
                            <g id="boxLidGroup" class="gift-lid">
                                <!-- Lid Top Side Left -->
                                <path d="M30 115 L150 160 L270 115 L150 70 Z" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
                                <!-- Lid Front Left Side -->
                                <path d="M30 115 L150 160 L150 175 L30 130 Z" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
                                <!-- Lid Front Right Side -->
                                <path d="M150 160 L270 115 L270 130 L150 175 Z" fill="#b91c1c" stroke="#991b1b" stroke-width="3"/>

                                <!-- Ribbon Straps on Lid -->
                                <path d="M78 97 L102 106 L222 61 L198 52 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
                                <path d="M78 97 L102 106 L102 121 L78 112 Z" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
                                <path d="M198 121 L222 112 L222 61 L198 52 Z" opacity="0" fill="#eab308"/>

                                <path d="M198 97 L222 106 L102 61 L78 52 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
                                <path d="M198 97 L222 106 L222 121 L198 112 Z" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>

                                <!-- Golden Ribbon Bow Knot on Top -->
                                <g id="ribbonBow">
                                    <!-- Left Loop -->
                                    <path d="M150 90 C110 50 70 60 95 95 C120 120 150 95 150 90 Z" fill="#fde047" stroke="#ca8a04" stroke-width="3"/>
                                    <path d="M145 88 C115 60 85 70 105 92" fill="none" stroke="#facc15" stroke-width="3"/>
                                    <!-- Right Loop -->
                                    <path d="M150 90 C190 50 230 60 205 95 C180 120 150 95 150 90 Z" fill="#fde047" stroke="#ca8a04" stroke-width="3"/>
                                    <path d="M155 88 C185 60 215 70 195 92" fill="none" stroke="#facc15" stroke-width="3"/>
                                    <!-- Center Knot -->
                                    <ellipse cx="150" cy="92" rx="14" ry="10" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
                                </g>
                            </g>
                        </svg>

                    </div>
                </div>

                <!-- Open Box Action Button -->
                <button id="openBoxBtn" onclick="openBox()" class="w-full max-w-xs py-4 px-8 rounded-2xl bg-gradient-to-r from-amber-400 via-amber-500 to-yellow-500 hover:from-amber-500 hover:to-yellow-600 text-slate-950 font-extrabold text-xl shadow-xl shadow-amber-500/20 active:scale-95 transition tracking-wider border-2 border-yellow-200 uppercase flex items-center justify-center gap-3">
                    <i class="fa-solid fa-key text-slate-900"></i>
                    <span data-i18n="openBtn">AÇ</span>
                </button>

            </div>

        </main>

        <!-- FOOTER INFO / STATS -->
        <footer class="p-3 bg-slate-950/70 border-t border-slate-800/80 text-center text-xs text-slate-400 z-20">
            <span data-i18n="footerText">Mystery Box Game • Canlı Simülatör Modu</span>
        </footer>

        <!-- REWARD RESULT MODAL OVERLAY -->
        <div id="rewardModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center z-50 p-4 transition-all">
            <div class="bg-slate-900 border border-slate-700 p-6 sm:p-8 rounded-3xl max-w-sm w-full text-center flex flex-col items-center gap-4 shadow-2xl relative transform scale-95 transition-transform duration-300">
                
                <!-- Rarity Badge -->
                <span id="rewardRarity" class="px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest text-white shadow-md">
                    RARITY
                </span>

                <!-- Reward Icon Container -->
                <div id="rewardGlow" class="w-32 h-32 rounded-2xl flex items-center justify-center my-2 transition-all">
                    <i id="rewardIcon" class="fa-solid fa-trophy text-6xl text-white drop-shadow-md"></i>
                </div>

                <!-- Reward Title -->
                <h3 id="rewardTitle" class="text-2xl font-black text-white">Ödül Adı</h3>
                <p id="rewardDesc" class="text-xs text-slate-300">Ödül açıklaması burada yer alır.</p>

                <!-- Try Again Button -->
                <button onclick="closeModal()" class="w-full mt-2 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 font-bold text-slate-200 transition border border-slate-700 uppercase tracking-wider text-sm">
                    <span data-i18n="tryAgainBtn">Tekrar Aç</span>
                </button>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // State variables
        let currentLang = 'tr';
        let currentDevice = 'pc';
        let isOpening = false;

        // Translations Object
        const translations = {
            tr: {
                settingsBtn: "Ayarlar",
                configTitle: "Oyun Ayarları",
                configSubtitle: "Devam etmeden önce dil ve ekran tercihinizi yapın",
                selectLanguage: "Dil Seçimi",
                selectDevice: "Cihaz Ekran Görünümü",
                devicePc: "Masaüstü (PC)",
                deviceTablet: "Tablet",
                devicePhone: "Telefon",
                continueBtn: "Devam Et",
                openBtn: "KUTUYU AÇ",
                blue: "Mavi",
                green: "Yeşil",
                red: "Kırmızı",
                footerText: "Mystery Box Game • Canlı Simülatör Modu",
                tryAgainBtn: "Tekrar Dene",
                rarityCommon: "YÜKSEK İHTİMAL (SIRA DIŞI)",
                rarityRare: "ORTA İHTİMAL (NADİR)",
                rarityLegendary: "DÜŞÜK İHTİMAL (EFSANEVİ)",
                prizeBlueTitle: "Mavi Kristal Ödülü",
                prizeBlueDesc: "Tebrikler! Mavi kategorisinden standart hediyeyi kazandınız.",
                prizeGreenTitle: "Yeşil Zümrüt Ödülü",
                prizeGreenDesc: "Harika! Orta nadirlikteki Yeşil Zümrüt ödülünü kazandınız.",
                prizeRedTitle: "Kırmızı Ejderha Elması",
                prizeRedDesc: "İNANILMAZ! En düşük ihtimalli Efsanevi Kırmızı Ödülü kazandınız!"
            },
            en: {
                settingsBtn: "Settings",
                configTitle: "Game Settings",
                configSubtitle: "Select your preferred language and viewport before starting",
                selectLanguage: "Language Selection",
                selectDevice: "Device Viewport Mode",
                devicePc: "Desktop (PC)",
                deviceTablet: "Tablet",
                devicePhone: "Phone",
                continueBtn: "Continue",
                openBtn: "OPEN BOX",
                blue: "Blue",
                green: "Green",
                red: "Red",
                footerText: "Mystery Box Game • Live Simulator Mode",
                tryAgainBtn: "Try Again",
                rarityCommon: "HIGH CHANCE (COMMON)",
                rarityRare: "MEDIUM CHANCE (RARE)",
                rarityLegendary: "LOW CHANCE (LEGENDARY)",
                prizeBlueTitle: "Blue Crystal Prize",
                prizeBlueDesc: "Congratulations! You won a standard Blue tier reward.",
                prizeGreenTitle: "Green Emerald Prize",
                prizeGreenDesc: "Awesome! You won a medium-rarity Green Emerald reward.",
                prizeRedTitle: "Red Dragon Diamond",
                prizeRedDesc: "UNBELIEVABLE! You won the ultra-rare Legendary Red reward!"
            },
            es: {
                settingsBtn: "Ajustes",
                configTitle: "Configuración del Juego",
                configSubtitle: "Elige tu idioma y vista de dispositivo antes de continuar",
                selectLanguage: "Selección de Idioma",
                selectDevice: "Modo de Dispositivo",
                devicePc: "Ordenador (PC)",
                deviceTablet: "Tableta",
                devicePhone: "Teléfono",
                continueBtn: "Continuar",
                openBtn: "ABRIR CAJA",
                blue: "Azul",
                green: "Verde",
                red: "Rojo",
                footerText: "Mystery Box Game • Modo Simulador en Vivo",
                tryAgainBtn: "Intentar de nuevo",
                rarityCommon: "PROBABILIDAD ALTA (COMÚN)",
                rarityRare: "PROBABILIDAD MEDIA (RARO)",
                rarityLegendary: "PROBABILIDAD BAJA (LEGENDARIO)",
                prizeBlueTitle: "Premio Cristal Azul",
                prizeBlueDesc: "¡Felicidades! Has ganado una recompensa estándar de categoría azul.",
                prizeGreenTitle: "Premio Esmeralda Verde",
                prizeGreenDesc: "¡Genial! Has ganado una recompensa de rareza media verde.",
                prizeRedTitle: "Diamante Dragón Rojo",
                prizeRedDesc: "¡INCREÍBLE! ¡Has ganado la ultra rara recompensa Leyenda Roja!"
            },
            fr: {
                settingsBtn: "Paramètres",
                configTitle: "Paramètres du Jeu",
                configSubtitle: "Choisissez votre langue et votre écran avant de continuer",
                selectLanguage: "Choix de la Langue",
                selectDevice: "Mode d'Affichage Appareil",
                devicePc: "Ordinateur (PC)",
                deviceTablet: "Tablette",
                devicePhone: "Téléphone",
                continueBtn: "Continuer",
                openBtn: "OUVRIR LA BOÎTE",
                blue: "Bleu",
                green: "Vert",
                red: "Rouge",
                footerText: "Mystery Box Game • Mode Simulateur en direct",
                tryAgainBtn: "Réessayer",
                rarityCommon: "GRANDE CHANCE (COMMUN)",
                rarityRare: "CHANCE MOYENNE (RARE)",
                rarityLegendary: "FAIBLE CHANCE (LÉGENDAIRE)",
                prizeBlueTitle: "Prix Cristal Bleu",
                prizeBlueDesc: "Félicitations ! Vous avez gagné une récompense bleue standard.",
                prizeGreenTitle: "Prix Émeraude Verte",
                prizeGreenDesc: "Génial ! Vous avez gagné une récompense verte de rareté moyenne.",
                prizeRedTitle: "Diamant Dragon Rouge",
                prizeRedDesc: "INCROYABLE ! Vous avez gagné la récompense Légendaire Rouge ultra rare !"
            }
        };

        // Initialize Settings on Load
        window.onload = function() {
            updateLanguageUI();
            updateDeviceUI();
        };

        // Change Language Instantly
        function changeLanguage(lang) {
            currentLang = lang;
            updateLanguageUI();
        }

        function updateLanguageUI() {
            // Update active state of buttons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('border-amber-500', 'bg-amber-500/10', 'text-amber-400');
                btn.classList.add('border-slate-700', 'bg-slate-900');
            });
            const activeBtn = document.getElementById(`lang-${currentLang}`);
            if(activeBtn) {
                activeBtn.classList.remove('border-slate-700', 'bg-slate-900');
                activeBtn.classList.add('border-amber-500', 'bg-amber-500/10', 'text-amber-400');
            }

            // Translate all elements with data-i18n attribute
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang] && translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });
        }

        // Change Device Viewport Live
        function changeDevice(device) {
            currentDevice = device;
            updateDeviceUI();
        }

        function updateDeviceUI() {
            const container = document.getElementById('appContainer');
            
            // Remove previous viewport classes
            container.classList.remove('viewport-pc', 'viewport-tablet', 'viewport-phone');
            
            // Add selected viewport class
            container.classList.add(`viewport-${currentDevice}`);

            // Update active styling on device buttons
            document.querySelectorAll('.device-btn').forEach(btn => {
                btn.classList.remove('border-amber-500', 'bg-amber-500/10', 'text-amber-400');
                btn.classList.add('border-slate-700', 'bg-slate-900');
            });
            const activeBtn = document.getElementById(`device-${currentDevice}`);
            if(activeBtn) {
                activeBtn.classList.remove('border-slate-700', 'bg-slate-900');
                activeBtn.classList.add('border-amber-500', 'bg-amber-500/10', 'text-amber-400');
            }
        }

        // Navigation Functions
        function startGameStage() {
            document.getElementById('settingsStage').classList.add('hidden');
            document.getElementById('gameStage').classList.remove('hidden');
            document.getElementById('resetStageBtn').classList.remove('hidden');
        }

        function showSettingsScreen() {
            document.getElementById('gameStage').classList.add('hidden');
            document.getElementById('settingsStage').classList.remove('hidden');
            document.getElementById('resetStageBtn').classList.add('hidden');
            closeModal();
        }

        // Main Box Opening Mechanics with Probabilities
        function openBox() {
            if (isOpening) return;
            isOpening = true;

            const giftBox = document.getElementById('giftBox');
            const openBoxBtn = document.getElementById('openBoxBtn');
            
            openBoxBtn.disabled = true;
            openBoxBtn.classList.add('opacity-50');

            // 1. Shake Box Animation
            giftBox.classList.add('opening');

            setTimeout(() => {
                // 2. Stop shaking & Lift Lid
                giftBox.classList.remove('opening');
                giftBox.classList.add('opened');

                // 3. Roll for Prize based on probabilities
                // Red: 7% (0 - 0.07), Green: 28% (0.07 - 0.35), Blue: 65% (0.35 - 1.0)
                const rand = Math.random();
                let prizeType = 'blue';

                if (rand < 0.07) {
                    prizeType = 'red';
                } else if (rand < 0.35) {
                    prizeType = 'green';
                } else {
                    prizeType = 'blue';
                }

                // Trigger Confetti & Reveal Modal
                setTimeout(() => {
                    showRewardModal(prizeType);
                }, 500);

            }, 1200);
        }

        // Show Modal & Trigger FX
        function showRewardModal(type) {
            const modal = document.getElementById('rewardModal');
            const rarityBadge = document.getElementById('rewardRarity');
            const rewardGlow = document.getElementById('rewardGlow');
            const rewardIcon = document.getElementById('rewardIcon');
            const rewardTitle = document.getElementById('rewardTitle');
            const rewardDesc = document.getElementById('rewardDesc');

            const lang = translations[currentLang];

            if (type === 'red') {
                // Low Chance / Legendary Red Reward
                rarityBadge.innerText = lang.rarityLegendary;
                rarityBadge.className = "px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest text-white shadow-md bg-rose-600";
                
                rewardGlow.className = "w-32 h-32 rounded-2xl flex items-center justify-center my-2 transition-all bg-gradient-to-tr from-rose-600 to-red-400 glow-red";
                rewardIcon.className = "fa-solid fa-crown text-6xl text-white drop-shadow-md animate-bounce";
                
                rewardTitle.innerText = lang.prizeRedTitle;
                rewardDesc.innerText = lang.prizeRedDesc;

                // High intensity confetti
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#ef4444', '#f59e0b', '#ffffff']
                });

            } else if (type === 'green') {
                // Medium Chance / Emerald Reward
                rarityBadge.innerText = lang.rarityRare;
                rarityBadge.className = "px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest text-white shadow-md bg-emerald-600";
                
                rewardGlow.className = "w-32 h-32 rounded-2xl flex items-center justify-center my-2 transition-all bg-gradient-to-tr from-emerald-600 to-teal-400 glow-green";
                rewardIcon.className = "fa-solid fa-gem text-6xl text-white drop-shadow-md";
                
                rewardTitle.innerText = lang.prizeGreenTitle;
                rewardDesc.innerText = lang.prizeGreenDesc;

                confetti({
                    particleCount: 70,
                    spread: 60,
                    origin: { y: 0.6 },
                    colors: ['#10b981', '#34d399', '#ffffff']
                });

            } else {
                // High Chance / Standard Blue Reward
                rarityBadge.innerText = lang.rarityCommon;
                rarityBadge.className = "px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest text-white shadow-md bg-blue-600";
                
                rewardGlow.className = "w-32 h-32 rounded-2xl flex items-center justify-center my-2 transition-all bg-gradient-to-tr from-blue-600 to-indigo-400 glow-blue";
                rewardIcon.className = "fa-solid fa-box-open text-6xl text-white drop-shadow-md";
                
                rewardTitle.innerText = lang.prizeBlueTitle;
                rewardDesc.innerText = lang.prizeBlueDesc;

                confetti({
                    particleCount: 40,
                    spread: 40,
                    origin: { y: 0.6 },
                    colors: ['#3b82f6', '#60a5fa', '#ffffff']
                });
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('rewardModal');
            const giftBox = document.getElementById('giftBox');
            const openBoxBtn = document.getElementById('openBoxBtn');

            modal.classList.add('hidden');
            
            // Reset Box State
            giftBox.classList.remove('opened', 'opening');
            openBoxBtn.disabled = false;
            openBoxBtn.classList.remove('opacity-50');
            isOpening = false;
        }
    </script>
</body>
</html>
